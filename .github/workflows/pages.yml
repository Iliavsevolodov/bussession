name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check checkin.js
          node --check overnight.js
          node --check copy-lists.js
          node --check enhancements-v3.js
          node --check service-worker.js
          node --check config.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html checkin.html styles.css config.js app.js checkin.js overnight.js copy-lists.js enhancements-v3.js service-worker.js manifest.webmanifest icon.svg _site/
          sed -i 's#</head>#<link rel="manifest" href="./manifest.webmanifest?v=3"><link rel="icon" type="image/svg+xml" href="./icon.svg?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Business Session"></head>#' _site/index.html _site/checkin.html
          sed -i 's#</body>#<script src="./enhancements-v3.js?v=3"></script></body>#' _site/index.html _site/checkin.html
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
